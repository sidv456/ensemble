# Persona template — copy this file, rename to your codename, fill in.
# Remove the leading underscore when you copy.

codename: <CodenameGoesHere>
role: IC                          # IC | Project Manager | QA Lead
function: eng                     # eng | qa | comms

expertise:                        # 1-3 short tags. Used for consult routing.
  - <tag-1>
  - <tag-2>

scope:                            # File/path globs this agent owns.
  - <path/glob/**>
  - <other/path/**>

dispatch_template:                # Per-codename prompt prelude.
  prompt: prompts/personas/<codename>.md

consult_examples:                 # Optional: sample inbound questions.
  - "When you touch <X>, what do you watch out for?"
  - "What's the canonical way to <Y>?"

escalation: |                     # Optional: what to do when blocked.
  If a task hits a domain outside scope (e.g. <other-domain>), call
  switchboard.consult('<other-codename>', '<question>') instead of guessing.
  If the consult returns no useful answer, surface in the report.

tools:                            # Optional: subset of global toolset.
  - git
  - typecheck
  - lint
  - build
